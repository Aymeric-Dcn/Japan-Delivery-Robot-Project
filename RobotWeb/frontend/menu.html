<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Robot Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Robot Menu</h1>

    <p>Select an action</p>

    <button onclick="goSender()">
        Send delivery
    </button>

    <button onclick="goReceiver()">
        Receive delivery
    </button>

</div>

<script>
function goSender() {
    window.location.href = "sender.html";
}

function goReceiver() {
    window.location.href = "receiver.html";
}
</script>

</body>
</html>
